<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Brow HTML App</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0b0f12;
        color: #dce6eb;
      }

      body {
        display: flex;
        flex-direction: column;
      }

      .html-app-tab-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 12px 16px;
        border-bottom: 2px solid rgba(168, 85, 247, 0.3);
        background: rgba(6, 10, 12, 0.98);
      }

      .html-app-tab-header strong {
        display: block;
        font-size: 14px;
        color: #e9defa;
      }

      .html-app-tab-header span {
        display: block;
        margin-top: 4px;
        color: #91a1a9;
        font-size: 11px;
      }

      .html-app-tab-header button {
        min-height: 34px;
        border: 1px solid rgba(168, 85, 247, 0.55);
        background: rgba(168, 85, 247, 0.16);
        color: #efe7fb;
        padding: 8px 12px;
        cursor: pointer;
        font: inherit;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        box-shadow: 4px 4px 0 rgba(74, 18, 130, 0.45);
      }

      .html-app-tab-error {
        margin: 12px 16px 0;
        color: #ffb7c4;
        font-size: 12px;
      }

      .html-app-tab-frame {
        flex: 1 1 auto;
        width: 100%;
        min-height: calc(100vh - 59px);
        border: 0;
        background: #0d0b15;
      }
    </style>
  </head>
  <body>
    <header class="html-app-tab-header">
      <div>
        <strong data-role="title">Loading HTML App Artifact…</strong>
        <span data-role="meta"></span>
      </div>
      <button type="button" data-action="download">Download HTML</button>
    </header>
    <div class="html-app-tab-error" data-role="error" hidden></div>
    <iframe class="html-app-tab-frame" data-role="iframe" title="Brow HTML App Artifact"></iframe>
    <script type="module" src="html-app-view.js"></script>
  </body>
</html>
