<div class="chat-header">
  <div class="header-brand">
    <div class="brand-copy">
      <img data-slot="brand-icon" alt="Agent WebMCP" class="brand-icon" />
      <span class="brand-label">BROW</span>
    </div>
  </div>
  <div class="header-meta">
    <div class="webmcp-indicator" data-slot="webmcp-indicator">
      <span class="status-dot unavailable"></span> WebMCP: N/A
    </div>
    <span class="connection-status" data-slot="connection-status">Ready</span>
    <div class="header-actions">
      <button class="new-chat-btn" data-action="new-chat" title="Start a new chat" aria-label="Start a new chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
          <path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h11"></path>
          <line x1="18" y1="3" x2="18" y2="9"></line>
          <line x1="15" y1="6" x2="21" y2="6"></line>
        </svg>
        <span>New Chat</span>
      </button>
      <button class="refresh-webmcp-btn" data-action="refresh-webmcp" title="Refresh WebMCP discovery" aria-label="Refresh WebMCP discovery">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="12" height="12">
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
      </button>
    </div>
  </div>
</div>
